name: ExtDN M2 PHPStan
on:
  workflow_call:
    inputs:
      composer_name:
        description: "Composer name"
        required: true
        type: string

jobs:
  phpstan:
    name: M2 PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The ExtDN action picks up phpstan.neon from the module root; paths resolve from the Magento root
      - name: Write PHPStan config
        run: |
          test -f phpstan.neon || cat > phpstan.neon <<'NEON'
          includes:
              - %currentWorkingDirectory%/dev/tests/static/testsuite/Magento/Test/Php/_files/phpstan/phpstan.neon
          parameters:
              ignoreErrors:
                  -
                      identifier: missingType.iterableValue
          NEON
      - uses: extdn/github-actions-m2/magento-phpstan/8.5@master
        with:
          composer_name: ${{ inputs.composer_name }}
          phpstan_level: 8
