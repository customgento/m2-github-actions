name: ExtDN M2 Coding Standard
on: [workflow_call]

jobs:
  static:
    name: M2 Coding Standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: extdn/github-actions-m2/magento-coding-standard/8.5@master
        # phpcs_extensions is not a declared input of the extdn action, so it is
        # set via env (read directly by its entrypoint) to avoid an "Unexpected input" warning
        env:
          PHPCS_EXTENSIONS: php,phtml
        with:
          phpcs_severity: 5
